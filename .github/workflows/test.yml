name: Test

# Checks formatting and runs the tests, which cover the code that needs no game files. The plugin itself references
# Rain World's own libraries, so it is built locally and not here.
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      # Folder mode checks the formatting rules in .editorconfig without loading any project, so it does not need the
      # game's libraries.
      - run: dotnet format whitespace --folder --verify-no-changes --exclude bin obj Resources.Designer.cs
      - run: dotnet run --project tests/Warp.Tests.csproj
